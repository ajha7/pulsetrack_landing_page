<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="PulseTrack">
  <defs>
    <linearGradient id="pt-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D6F5"/>
      <stop offset="0.55" stop-color="#3FE0C0"/>
      <stop offset="1" stop-color="#46E08F"/>
    </linearGradient>
    <filter id="pt-glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F1620"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#A6B8CC" stroke-opacity="0.16" stroke-width="1.5"/>
  <polyline points="7,34 21,34 25,30 29,38 33,13 38,52 42,29 46,34 57,34"
    fill="none" stroke="url(#pt-pulse)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#pt-glow)"/>
</svg>
